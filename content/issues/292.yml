time: "Jul 27, 2026"
subject: "North Korean campaign uses fake coding interviews to steal developer credentials"
draft: false

description: |
  Hi everyone,

  Crazy story this week, North Korean campaign use fake coding interviews to steal credential, discover by ElasticSearch. Level up your guard and akways run coding interview in a sandbox. Quick and safe enough is to run inside a non root docker image. Stronger way is to use VM such as [container](https://github.com/apple/container) or FireCrakcer or qemu vm.

  If you enjoy BetterDev, please spread the word by sharing it with your friends. And if you'd like to support my work, [buying me a coffee](https://www.buymeacoffee.com/betterdev) would be much appreciated.

