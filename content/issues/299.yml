    category: ['sponsor']
  - url: https://blog.master.dev/new-things-you-should-know-about-html-here-in-mid-2026/
    title: New things you should know about HTML here in mid 2026
    description: |
      A roundup of what shipped in HTML lately. The one worth your time: `<geolocation>` and `<usermedia>`, real elements for asking permission, built with a recovery flow so someone who denied once can undo it - 65% manage that, against 10% with today's prompts. Also `appearance: base-select` to finally style `<select>`, `hidden="until-found"`, `focusgroup`, and Apple's `<model>` for 3D.

  - url: https://www.tigerdata.com/blog/real-cost-of-single-insert-in-postgres
    title: "The Real Cost of a Single Insert in Postgres"
    description: |
      A 40-byte sensor reading costs about 345 bytes of WAL before the commit returns - 8.6x write amplification. The 24-byte MVCC header is only the start: each index emits its own WAL record, and index maintenance alone is ~70% of the volume. Drop all three indexes and it falls to 2.44x. Fixes are batching with `COPY` and `wal_compression`.


