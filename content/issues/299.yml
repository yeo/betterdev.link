  - url: https://www.vpdae.com/redirect/nug17xschc256j6pm4qcwevdo3
    title: "Prepathon 2026: Build, Ship & Scale at Velocity. A Free Online Event for Developers, DevOps & Engineering Leaders (Sep 22–23)"
    description: |
      <p style="display: block; margin-block-start: 0.75rem;">The decisions separating teams that ship reliably from teams that don't aren't always obvious. They live in how you structure ownership, where your infrastructure costs actually come from, and what happens to your architecture when velocity increases..<br></p>
      <p style="display: block; margin-block-start: 0.75rem;">Prepathon 2026 is a free two-day online event from Cloudways running September 22-23, built around exactly these decisions.<br></p>
      <p style="display: block; margin-block-start: 0.75rem;">Across two days you'll hear from engineers navigating them in production right now. What modern deployment looks like at scale. Where API-first product economics get complicated and how to structure ownership before the costs become a problem. How architecture and accountability shift when teams ship faster. And where AI-assisted development actually saves time versus where it introduces new failure modes.<br></p>
      <p style="display: block; margin-block-start: 0.75rem;">Every session comes from engineers doing the work, not explaining what best practice should look like in theory.<br></p>
      <p style="display: block; margin-block-start: 0.75rem;">Seats are limited.<br></p>
    category: ['sponsor']

