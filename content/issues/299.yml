    title: "Real-Time Search Data for Your AI and Apps"
    description: |
      <p style="display: block; margin-block-start: 0.75rem;">Web Search Data, Ready as JSON and Markdown. <a href="https://serpapi.com/betterdevlink">SerpApi</a> gives developers real-time, structured results from Google Search, Maps, Shopping, and 100+ search engine APIs through a simple API call.<br></p>
    category: ['sponsor']
  - url: https://kolemannix.com/blog/how-to-name-things/
    title: How to Name Things
    description: |
      The thesis: name a thing for what it is, not for the job that made you write it. His example is `mergeTargetValuesIntoSourceTemplate()`, which turned out to be plain map union - the need-derived name hid that and stopped anyone reusing it. He is also against naming rules like never abbreviate, calling them a refusal to engage with the primitives.

  - url: https://bkovac.github.io/modem-thing/
    title: "Converting a $20 4G wireless hotspot into a texting device"
    description: |
      A $20 4G hotspot already runs Linux, so rather than bolt on a microcontroller the modem itself becomes the whole computer - OpenStick for the OS, a custom PCB for USB mode switching and power, a Clicks keyboard and a SHARP memory display. The DRM display driver is hand-written too, with Atkinson dithering. High-speed USB only enumerated after the wires were twisted tighter.

  - url: https://tidydesign.substack.com/p/a-coding-agent-is-six-functions-in
    title: "A coding agent is six functions in a trenchcoat"
    description: |
      Read file, write file, edit file, list files, search, run command - that is the whole surface of a coding agent, and only the first two plus the shell are really needed, since the shell is the get-out-of-jail card for everything else. Edit earns its place because without it a one-line change in a 500-line file regenerates all 500. Demo in R with `ellmer`.

