description: |
  Hi all,

  We come back with a new issue this week. If you like BetterDev, please help spead word out by refer to your friends. [Buy me a coffee](https://www.buymeacoffee.com/betterdev) would be great too.

  This week I couldn't help myself to exploring many PostgreSQL concept and ChatGPT/LLAMA models. I especially love to use  I had use Postgres extensively and confident to say nowsaday with properly turning you just need it, no need Redis or any other key-value store.

