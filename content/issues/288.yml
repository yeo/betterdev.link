links:
  - url: https://www.vpdae.com/redirect/5vhsoxpyrlznbtw2znmhmqopv0a
    title: "How OpenRouter centralized secrets sprawling across 70+ providers"
    description: |
      <p style="display: block; margin-block-start: 0.75rem;">Every new API key means tracking down which services need it, then updating each one by hand. At OpenRouter, that happened one to two times a week.<br></p>

      <p style="display: block; margin-block-start: 1rem;">OpenRouter runs the largest AI gateway for developers, with infrastructure spanning Vercel, GCP, and Cloudflare and 70+ model providers. Each one ships its own keys, propagated manually with custom scripts, and no audit trail. A leaked production credential meant downtime and an SLA breach.<br/></p>

      <p style="display: block; margin-block-start: 1rem;">The team adopted Cursor, Claude Code, Devin, and Codex, and each needed scoped access to run services end to end without reaching credentials it shouldn't.<br></p>

      <p style="display: block; margin-block-start: 1rem;">OpenRouter centralized everything on Infisical:</p>
      <p style="display: block; margin-block-start: 0.25rem;">→ Dynamic folder sync replaced the scripts: one folder for all provider keys, imported into the services that need them</p>
      <p style="display: block; margin-block-start: 0.25rem;">→ Role-based access separates dev, admin, and break-glass production: A dedicated agent tier issues session-scoped credentials, so tools like Cursor and Claude Code pull dev secrets directly and run read-only cron jobs against production, scoped to exactly what they need.</p>
      <p style="display: block; margin-block-start: 0.25rem;">→ Audit logging: It closed the visibility gap on when and why a secret changed.</p>

      <p style="display: block; margin-block-start: 1rem;">The payoff: spinning up a new service dropped from a multi-service manual chore to about 10 minutes. 21 services now sync through Infisical and 50+ engineering hours are saved per month.</p>
      <p style="display: block; margin-block-start: 1rem;">As founding engineer Shashank Goyal put it: "With Infisical, you get the security benefit along with improved developer experience, it becomes a no-brainer.".</p>
      <p style="display: block; margin-block-start: 1rem;"><a href="https://www.vpdae.com/redirect/5vhsoxpyrlznbtw2znmhmqopv0a">Read the full case study.</a></p>
    category: ['sponsor']

