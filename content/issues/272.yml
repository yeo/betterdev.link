time: "Dec 09, 2024"
subject: "Memory: The Forgotten History and Why did Windows 95 setup use three operating systems?"
draft: false

description: |
  Hi all,

  It's chrismast time. Time for led lighting project. This year I came across this [WLED project](https://kno.wled.ge/), a fast and feature-rich implementation of an ESP8266/ESP32 webserver to control NeoPixel (WS2812B, WS2811, SK6812) LEDs or also SPI based chipsets like the WS2801 and APA102! They had all the resouces from hardware to software to UI and mobile app to contrl your light.

  If you enjoy BetterDev, please spread the word by sharing it with your friends. And if you'd like to support my work, [buying me a coffee](https://www.buymeacoffee.com/betterdev) would be much appreciated.


