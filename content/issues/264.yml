time: "Aug 26, 2024"
subject: "Implement realtime mouse pointer and Postgres as a search engine"
draft: false
description: |
  Hi all,

  This week, where I live, I can already felt the autumn season is around. Hope everyone can enjoy a last few days of summer and be ready for fall season.

  Many times, we as engineer are discourage from re-invent the wheel. If you want cache, use Redis, want seach, use ElasticSearch. Lets forget that shit thinking. Dive right in. Implement your own search engine. Write your own database. That's why this week I had include such a few links. I hope you like them.

  Now onward to our newsletter. Again, if you like BetterDev, please help spead word out by refer to your friends. [Buy me a coffee](https://www.buymeacoffee.com/betterdev) would be great too.

  
links:
  - url: https://www.canva.dev/blog/engineering/realtime-mouse-pointers/
    title: "Realtime mouse pointer"
    description: |
      In collabortion app you will usually see the cursor of all the user moving around. How would we implement that? At scale. Canvas engineering share with us here. Some good find such as using a Binary serialization instead of JSON to reduce CPU load on backend

  - url: https://anyblockers.com/posts/postgres-as-a-search-engine
    title: "Postgres as a search engine"
    description: "Build a retrieval system with semantic, full-text, and fuzzy search in Postgres to be used as a backbone in RAG pipelines. We will do all: full text search, semantic search, fuzzy search with Postgres"

  - url: https://writings.stephenwolfram.com/2024/08/whats-really-going-on-in-machine-learning-some-minimal-models/
    title: "What’s Really Going On in Machine Learning? Some Minimal Model"
    description: "It’s surprising how little is known about the foundations of machine learning. Yes, from an engineering point of view, an immense amount has been figured out about how to build neural nets that do all kinds of impressive and sometimes almost magical things. But at a fundamental level we still don’t really know why neural nets “work”—and we don’t have any kind of “scientific big picture” of what’s going on inside them."

  - url: https://qsantos.fr/2024/08/25/linux-pipes-are-slow/
    title: Linux Pipes are Slow
    description: |
      Some programs use a particular system call “vmsplice” to move data faster through a pipe. When not using vmsplice, Linux pipes are slower than what I would have expected. Since we cannot always use it, lets see exactly why that was, and whether it could be improved.

  - url: https://www.allthingsdistributed.com/2024/08/continuous-reinvention-a-brief-history-of-block-storage-at-aws.html
    title: "Continuous reinvention: A brief history of block storage at AWS"
    description: "Marc Olson has been part of the team shaping Elastic Block Store (EBS) for over a decade. In this post, Marc provides a fascinating insider’s perspective on the journey of EBS. He shares hard-won lessons in areas such as queueing theory, the importance of comprehensive instrumentation, and the value of incrementalism versus radical changes. Most importantly, he emphasizes how constraints can often breed creative solutions. It’s an insightful look at how one of AWS’s foundational services has evolved to meet the needs of our customers (and the pace at which they’re innovating)."

  - url: https://lostintransit.se/2024/08/21/ethernet-history-deepdive-why-do-we-have-different-frame-types/
    title: "Ethernet History Deepdive – Why Do We Have Different Frame Types?"
    description: "Take us into the history of Ethernet to see why things happened the way they did. It will also significantly enhance your network knowledge."

  - url: https://blog.sylver.dev/build-your-own-sqlite-part-1-listing-tables
    title: "Build your own SQLite, Part 1: Listing tables"
    description: "As developers, we use databases all the time. But how do they work? In this series, we'll try to answer that question by building our own SQLite-compatible database from scratch.Source code examples will be provided in Rust, but you are encouraged to follow along using your language of choice, as we won't be relying on many language-specific features or libraries."

  - url: https://blog.devops.dev/advanced-monitoring-with-ai-and-prometheus-detecting-and-mitigating-memory-leaks-230c9d64fa30
    title: "Advanced Monitoring with AI and Prometheus: Detecting and Mitigating Memory Leaks"
    description: "Detect memory by just looking at growth rate of memory is simple. What if we train a model of leak pattern, and apply it to detect it sooner and more efficent?"

  - url: https://drew.silcock.dev/blog/how-postgres-stores-data-on-disk/
    title: "How Postgres stores data on disk – this one's a page turner"
    description: "databases are basically magic, and SQL is the arcane tongue that allows you to channel that magic. In fact, it’s easy to think of databases like a black box where you make sure your tables are indexed sensibly and your queries aren’t doing anything silly, and the rest just happens. But at the end of day, they are just software, that works with hardware, and use some great tricks or abstraction. So we will dive into that"

  - url: https://drew.silcock.dev/blog/how-postgres-stores-oversized-values/
    title: "How Postgres stores oversized values – let's raise a TOAST"

