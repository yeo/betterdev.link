  - url: https://xata.io/blog/migrations-and-exclusive-locks
    title: Schema changes and the Postgres lock queue
    description: |
      There are two classes of breakage that can occur when applying database migrations: Migrations that make incompatible changes to the schema, breaking client applications, Migrations that lock a database object for an unacceptable amount of time, causing the application to become unavailable as reads and writes start to fail.
      Today we're going to talk about the second type of breakage: how long running queries together with DDL statements can lock out reads and writes from a table, causing application downtime.
 
