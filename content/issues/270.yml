  Welcome to another issue of BetterDev! This week I come across Colmi, a smart ring where you can write your own software to interact with it. It's also have a [$12.51 deal on AliExpress](https://www.aliexpress.us/item/3256806445134241.html?gatewayAdapt=glo2usa4itemAdapt) so very affordable to toy around with hardware.
  
  If you enjoy BetterDev, please spread the word by sharing it with your friends. And if you'd like to support my work, [buying me a coffee](https://www.buymeacoffee.com/betterdev) would be much appreciated.

