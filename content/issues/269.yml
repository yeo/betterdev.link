time: "Oct 14, 2024"
subject: "LLM from scratch with Pytorch"
draft: true

description: |
  Hi all,

  Welcome to another issue of BetterDev. The more I play with LLM, the more I liked them, they aren't perfect and definetely not gonna replace a real programming job IMHO. However, they excel a lot at identify pattern and repeative work. I think LLM will eventually become like email where majority of users will use an email provider, with a few host their own. That's why I had started to include more and more LLM related stuff, but following first principal rule. You will found many link to help us learn, understand LLM, build them from scratch as a programmer, not just as an end consumer.

  If you have been worried wherether this newsletter has been converted into AI "hype", then definetely not. They had their use and I want to include these wonderful tools and knowledge for our audience.

  If you enjoy BetterDev, please spread the word by sharing it with your friends. And if you'd like to support my work, [buying me a coffee](https://www.buymeacoffee.com/betterdev) would be much appreciated.

