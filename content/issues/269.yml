  - url: https://medium.com/@msouza.os/llm-from-scratch-with-pytorch-9f21808c6319
    title: "LLM from scratch with Pytorch"
    description: |
      Have you ever feel overwhelm with all the news about LLM? what is these 70B 4B or 3.5 4.0? Or when you go and check out the code of some project, it's super short and simple, where is the logic?
      In this link, we go back to that root to understand how to build an LLM by using Pytorch.

  - url: https://gwolf.org/2024/10/started-a-guide-to-writing-fuse-filesystems-in-python.html
    title: "Started a guide to writing FUSE filesystems in Python"
    description: |
      Have you ever feel like iCloud drive, Google Drive or Dropbox app is magic? What power them? It's pretty much FUSE behind the scene. Can we turn random data available through RPC into a file system?

  - url: https://brokencloudstorage.info/
    title: "End-to-End Encrypted Cloud Storage in the Wild: A Broken Ecosystem"
    description: |
      Cloud storage is ubiquitous: Google Drive, Dropbox, and OneDrive are household names. However, these services do not provide end-to-end encryption (E2EE), meaning that the provider has access to the data stored on their servers. The promise of end-to-end encrypted cloud storage is that users can have the best of both worlds, keeping control of their data using cryptographic techniques, while still benefiting from low-cost storage solutions.

  - url: https://kylezhe.ng/posts/crafting_qr_codes
    title: "Crafting qr codes"
    description: |
      QRCode is everywhere nowsaday. However, they doesn't need to be just square black and white box. How can we generate QRcode that looks artsy while still readable to the decoder? 

  - url: https://imbue.com/research/70b-infrastructure/
    title: "From bare metal to a 70B model: infrastructure set-up and scripts"
    description: |
      In the span of a few months, with a small team of researchers and engineers, imblue trained a 70B parameter model from scratch on our own infrastructure that outperformed zero-shot GPT-4o on reasoning-related tasks. Today, we’re sharing an end-to-end guide for setting up the required infrastructure: from bringing up the initial cluster and installing the OS, to automatically recovering from errors encountered during training. In each step, we detail the challenges we encountered and how we resolved them. Along with our learnings, we’re releasing many of the infrastructure scripts we developed to ensure healthy hosts, so that other teams can more easily create stable infrastructure for their own model training.

  - url: https://r.ena.to/blog/optimizing-postgres-table-layout-for-maximum-efficiency/
    title: "Optimizing Postgres table layout for maximum efficiency"
    description: |
      When modeling a Postgres database, you probably don’t give much thought to the order of columns in your tables. After all, it seems like the kind of thing that wouldn’t affect storage or performance. But what if I told you that simply reordering your columns could reduce the size of your tables and indexes by 20%? This isn’t some obscure database trick — it’s a direct result of how Postgres aligns data on disk.

  - url: https://ngrok.com/blog-post/how-we-built-ngroks-data-platform
    title: "How ngrok build their data platform"
    description: |
      This article is a look at how ngrok built it, what they learned, as well as some selective deep dives I found interesting enough to be worth sharing in more detail, since they’ll bridge the gap between what people usually understand by the term “data engineering” and how we run data here at ngrok.  Some of this might even be useful (or, at the very least, interesting!) for your own data platform endeavors, whether your team is big or small.

  - url: https://pthorpe92.dev/programming/systems/threads-async-runtimes-part0/
    title: "Confusing or misunderstood topics in systems programming"
    description: |
      Threads and the general concept of concurrency are among the most widely misunderstood and confusing topics for newer developers. This is partially due to popular language features that abstract away the details, leaving many developers with a lack of understanding of the underlying concepts. This series is meant to help clarify some of these concepts and provide a better understanding of how they work.

  - url: https://beeps.website/blog/2024-10-09-why-govuk-exit-this-page-doesnt-use-escape/
    title: "Why GOV.UK’s Exit this Page component doesn’t use the Escape key"

