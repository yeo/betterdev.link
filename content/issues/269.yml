  - url: https://netflixtechblog.com/pushy-to-the-limit-evolving-netflixs-websocket-proxy-for-the-future-b468bc0ff658
    title: "Pushy to the Limit: Evolving Netflix’s WebSocket proxy for the future"
    description: |
      It's a very high level discussion of how Netflix improve and evolve their websocket infrastructure to perform many kind of tasks. There isn't much technical discussion on this post, but more about concept and system design. If something is proven to work at this scale for Netflix, it might work for us too. So could be a good read into how company with massive infra design their system. I also like how they throw numbers and calculation.

