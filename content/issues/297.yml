      <p style="display: block; margin-block-start: 0.75rem;">Add Web Search to Your AI Agents. Ground LLM responses with live, structured search results from Google and other engines, ready for tool calling and RAG pipelines.<br></p>
    category: ['sponsor']


  - url: https://kciter.so/posts/the-expensive-main-thread/en/
    title: The Browser's Main Thread Is Expensive
    description: |
      Mobile dev has learned to never block main thread for years. For us, web dev, I'm sure we were frustrated with slow scrolling side, click a button and the site seems freeze. And maybe we start make less network call, reduce the bundle size and so on. But it goes beyond that, the code is fine, they aren't slow but they block the main thread. We learn about it here.

  - url: https://yui.dev/blog/minesweeper-in-247-bytes
    title: "The Depths of JavaScript: Minesweeper in 247 Bytes"
    description: |
      features a randomly generated 8x8 board, lets you open cells with left click, toggle flags with right click, opens cells with zero neighboring mines recursively, and has basic win detection.
      How is this even possible???

  - url: https://jakearchibald.com/2026/css-custom-property-compute-time/
    title: Controlling when CSS custom property values are computed
    description: |
      A custom property answers differently depending on whether you registered it. Unregistered, it stays a raw token stream and its functions evaluate wherever you `var()` it - so `sibling-index()` reads the child's position, not the parent's. Register it with `@property` and it computes at the declaration instead. Same trap for `em`, `ch`, `lh`, container query units and relative URLs.

  - url: https://x.com/sadkatwt/status/2093326670749184153
    title: LSM Trees and Its Relation With Database
    description: |
      A beginner-friendly walk through the engine behind RocksDB, Cassandra and CockroachDB's Pebble: writes hit a WAL and a memtable, that flushes to immutable sorted files, and compaction merges them down levels each holding 10x the one above. My favourite bit is why memtables use a skip list rather than a red-black tree: rebalancing forces you to lock it.

  - url: https://ewpratten.com/blog/ssh-secure-enclave/
    title: Authenticating SSH sessions with Secure Enclave
    description: |
      In the day of AI, anything without physical confirmation, can be easily to be a "hack" or "workaround" with the LLM. SSH is the key to the kingdom. Today, we learn how to setup Secure Enclave to authenticate SSH. The nice thing about it is that the key cannot be extracted out. Mean if you migrate to a new laptop, the secure enclave seed won't follow you. Very secure, but also a rough edge.


  - url: https://www.youtube.com/playlist?list=PL38NNHQLqJqYnNrTenxBvGJSPCkV9EOWk
    title: "The CPU Cache (video playlist)"
    description: |
      Nine animated videos from BitLemon: how a cache is organised inside the CPU, the L1/L2/L3 hierarchy, SRAM vs DRAM, replacement and write policies, the four C's of misses, then two episodes building a cache simulator in C++. A memory round trip costs about a hundred cache hits, so most slow code isn't doing too much work, it's laying its data out badly.

  - url: https://tapoueh.org/blog/2026/08/introducing-yesql-practical-postgresql-one-concept-at-a-time/
    title: "Introducing YeSQL: Practical PostgreSQL, One Concept at a Time"
    description: |
      It's always good to know how to do something. Like my wife said, youc an order food, but better if you can cook yourself. In this seris, we learn about many concept of practical PostgreSQL. Practical mean we will facing them every single day and anyone run a PostgresSQL db with modest workload face these sooner or later.


  - url: https://0xax.dev/
    title: "Systems Inside"
    description: |
      Just as I said above. Let learn system inside out. Alexander Kuleshov's home for [linux-insides](https://github.com/0xAX/linux-insides), now with a proper reader around it: 64 chapters of kernel internals read straight from the source - boot, interrupt gates, syscall dispatch, timers, spinlocks, memblock, per-CPU variables. Beside it, a seven-part x86-64 assembly series and Field Notes on real performance investigations.

  - url: https://mvakde.github.io/blog/44-on-arc-1/
    title: 44% on ARC-AGI-1 in 67 cents
    description: |
      A small transformer trained from scratch in 1.5 hours on one 5090 - beats many LLMs on ARC-AGI-1, matches TRM/HRM, costs 67 cents. The ablations say two choices carry it: 3D RoPE and a per-puzzle embedding, and dropping either turns 44% into 24%. The odd bit the author can't explain: removing input tokens from the loss makes test loss worse while the score goes up.

  - url: https://michael.stapelberg.ch/posts/2026-09-06-dcs-fast-turbopfor-go-simd/
    title: "Debian Code Search: Fast TurboPFor with Go SIMD"
    description: |
      Debian Code Search carried a cgo dependency on the C TurboPFor codec for seven years, and Go 1.26's experimental `simd/archsimd` finally killed it. The Go rewrite beat C, helped by AVX512 kernels and a positional popcount trick worth another 2x - though the post is honest that backporting both to C puts Go at about 1.4x slower.

read_code:
  - url: https://github.com/microsoft/tgrep
    title: tgrep
    description: |
      for Rust readers: ripgrep scans every byte on every query, which stops being fine around a 400k-file monorepo. tgrep pre-builds a trigram index and serves queries from a resident server - up to 52x faster on gecko-dev, and it powers grep inside GitHub Copilot CLI. Read it for the HybridIndex: mmap'd disk reader, in-memory overlay, rayon indexer you can query mid-build.
    category: ['Rust']

tool:
  - url: https://github.com/pgrundev/pgbot
    title: pgbot
    description: |
      one static Go binary that connects to Postgres read-only, reads the statistics views the server already keeps about itself, and prints a graded health report - a score plus findings bucketed CRITICAL/WARNING/NOTE. It diffs against the last run, so "3.2x slower" and "3 unused indexes eating 18 GB" surface as changes. No agent, no exporter, no write privilege. Apache-2.0.

  - url: https://github.com/pgrundev/pgterm
    title: pgterm
    description: |
      htop for every Postgres you own - one tab per database showing connections, cache, locks, query regressions, unused indexes, vacuum and replication, checked in the background so a tab that goes red is flagged without stealing focus. Config stores environment variable names rather than connection strings, so nothing lands in `ps`, and there is no SQL console anywhere. Rust, drives pgbot underneath.

  - url: https://github.com/skalesapp/skales
    title: Skales
    description: |
      A desktop AI agent that installs like a normal app - no Docker, no terminal - then works on its own: `/goal` runs a task in the background across restarts, `/code` binds a folder to a chat with inline diffs and undo. Bring a key from 15+ providers or point it at Ollama. Note the repo is distribution only - Skales itself is closed source.

  - url: https://github.com/hybridgroup/yzma
    title: yzma
    description: |
      llama.cpp inside your Go program, same process, no cgo: it binds through `purego` and dlopens the prebuilt library at runtime, so you keep a normal `go build`, working cross compilation, and a llama.cpp you can swap without rebuilding. Over 96% of the API, text and multimodal, with CUDA, Metal, Vulkan and ROCm. It even runs in the browser via TinyGo and WebAssembly. Apache-2.0.

  - url: https://github.com/dstotijn/hetty
    title: hetty
    description: |
      we linked to this back in [issue #173](https://betterdev.link/issues/173) when it was a promising idea; six years on it is a feature-complete open source answer to Burp Suite Pro. MITM proxy with searchable logs, interception, a client for replaying and hand-editing requests, scopes and per-project storage, all behind a web UI. One Go binary, and `--chrome` launches a browser already trusting the CA. MIT.

  - url: https://tailscale.com/blog/tailcat
    title: tailcat
    description: |
      netcat over Tailscale's data plane with none of Tailscale attached: no accounts, no control plane, no admins, no root. The server prints an address string, you hand it over out of band, and the two ends rendezvous through DERP then NAT-punch to a direct WireGuard connection. All userspace - no TUN device, no routing table changes.

self_hosted:
  - url: https://github.com/mayukh4/linux-android
    title: linux-android
    description: |
      a pretty nifty hack: the old Android phone in your drawer is an arm64 box with a battery and a GPU. One Termux script - no root, no PC - installs a real desktop with GPU acceleration and OpenSSH, so you SSH in from your laptop and treat it as a small always-on server. A second script puts Home Assistant on it. MIT.

  - url: https://github.com/benmaster82/Kwipu
    title: Kwipu
    description: |
      ask questions across a folder of Markdown notes and get an answer that connects several files, entirely local via Ollama. More than a RAG wrapper because it reads the structure you already wrote: `[[wikilinks]]` and YAML frontmatter become graph triples, and retrieval blends vectors, BM25 and temporal metadata. Runs as an MCP server too, so Claude Desktop or Cursor can query your vault. Python, MIT.

  - url: https://github.com/goposta/posta
    title: Posta
    description: |
      a self-hosted SendGrid in one Go binary: send over your own SMTP through an HTTP API, with templates, campaigns, subscriber lists, bounce handling and analytics. Inbound is a real SMTP receiver that turns mail into webhooks, and relay mode keeps an existing SMTP client working while you migrate. Nice extra: a per-form endpoint your contact form posts to, with honeypot and spam scoring. AGPL-3.0.
