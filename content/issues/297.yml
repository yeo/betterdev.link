tool:
  - url: https://github.com/pgrundev/pgbot
    title: pgbot
    description: |
      one static Go binary that reads the statistics views Postgres already keeps about itself and prints a graded health report, diffed against the last run so regressions surface as changes rather than numbers you have to remember.

  - url: https://github.com/pgrundev/pgterm
    title: pgterm
    description: |
      htop for every Postgres you own - one tab per database showing connections, locks, query regressions, unused indexes, vacuum and replication, checked in the background so a tab that goes red gets flagged while you read another.

  - url: https://github.com/skalesapp/skales
    title: Skales
    description: |
      a desktop AI agent that installs like a normal app - no Docker, no terminal - and runs multi-step tasks in the background against any of 15+ providers or a local Ollama, though the repo is distribution only and the app itself is closed source.

  - url: https://github.com/hybridgroup/yzma
    title: yzma
    description: |
      llama.cpp inside your Go program in the same process with no cgo - it dlopens the prebuilt library through `purego`, so you keep a normal `go build` and can swap in a newer llama.cpp without rebuilding.

  - url: https://github.com/dstotijn/hetty
    title: hetty
    description: |
      we linked to this back in [issue #173](https://betterdev.link/issues/173) as a promising idea; six years on it is a feature-complete open source Burp Suite Pro - MITM proxy, interception, request replay, scopes and per-project storage, in one Go binary.

  - url: https://tailscale.com/blog/tailcat
    title: tailcat
    description: |
      netcat over Tailscale's data plane with none of Tailscale attached - no accounts, no control plane, no root - just an address string you hand over out of band, after which the two ends NAT-punch to a direct WireGuard connection.

