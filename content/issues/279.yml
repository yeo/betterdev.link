time: "June 08, 2025"
subject: "What is Entropy and How DCI Movie Delivery and Encryption works"
draft: false

description: |
  Hi all,

  I had been a heavy AI/LLM user. Recenntly I'm impressive with what Gemini can do. It helps me write a lot of helper and tedious script which will take me days or even weeks now I can do in 1/10 of time. So I plan to share more about LLM/AI to help all of us. Thing like "write a systemd timer" to "only keep the file created today to prevent disk filling".

  Mozilla is shutting down Pocket on July 8, 2025. In spirit of self-hosted, I had switch to [linkding](https://linkding.link/]. I then use this [simple script](https://gist.github.com/v9n/7453a635acc2d7a84a28619b1e2ede7c) to import Pocket archive to linkding. The script was written by Gemini btw.

  If you enjoy BetterDev, please spread the word by sharing it with your friends. And if you'd like to support my work, [buying me a coffee](https://www.buymeacoffee.com/betterdev) would be much appreciated.

