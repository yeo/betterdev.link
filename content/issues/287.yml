links:
  - url: https://www.vpdae.com/redirect/cyv568yz6xs9hoatt44wtmyi01b
    title: "[Free Live Tech Session] How AI Agents Can Write, Test, And Fix Their Own Code In Kubernetes"
    description: |
      <p style="display: block; margin-block-start: 0.75rem;">Live technical workshop | June 18 | 11am ET / 8am PT | 45 min + Q&A<br></p>

      <p style="display: block; margin-block-start: 1rem;">Your AI agent writes code fast. So fast it barely matters now. The bottleneck is what comes after: running it, watching it break against real infrastructure, and debugging the gap between what the agent assumed and what your cluster actually does.<br/></p>

      <p style="display: block; margin-block-start: 1rem;">The agent never saw your queue payloads. It guessed your database schema. It has no idea that the downstream service returns 429 under real load. So you validate. Manually. Every time. That validation tax is the problem we're solving live on June 18..<br></p>

      <p style="display: block; margin-block-start: 1rem;">What you'll watch happen in real time:</p>
      <p style="display: block; margin-block-start: 0.25rem;">We'll connect a Cursor agent to a real Kubernetes cluster using mirrord and run the full loop: inspect live environment state, generate code informed by what's actually there, test immediately against real services, watch it fail, and watch the agent fix itself. No mocks. No deploy cycle. No human in the loop. The agent calls inspect, generate, test, fix autonomously. Total time from failure to working code: under 30 seconds.<br/></p>

      <p style="display: block; margin-block-start: 1rem;">Engineering teams at monday.com and similar companies already run this pattern in production. 350+ engineers at monday.com use mirrord daily. They cut dev feedback loops from 30 minutes to 30 seconds.

      <p style="display: block; margin-block-start: 1rem;">You'll leave with:</p>
      <p style="display: block; margin-block-start: 0.25rem;">A reference architecture for wiring agents to real clusters safely. The exact prompts and mirrord config from the demo. A clear mental model for where human judgment still belongs and where agents can own the loop.</p>
      <p style="display: block; margin-block-start: 0.25rem;">Built for engineers who are done validating what the agent should be validating itself.</p>

      <p style="display: block; margin-block-start: 1rem;">Hosted by Arsh Sharma (Senior DevRel, MetalBear) and Aviram Hassan (Founder and CEO, <a href="https://metalbear.com">MetalBear</a>, co-creator of <a href="https://metalbear.com/mirrord/">mirrord</a>).</p>
    category: ['sponsor']

