  - url: https://8dcc.github.io/programming/pool-allocator.html
    title: "Writing a simple pool allocator in C"
    description: |
      When you need memory for your program, you can malloc.
      Similarly to malloc, a pool allocator allows the user to allocate memory at run time. The pool allocator, however, is much faster than malloc1, at the cost of having a fixed pool size. It allows the user to allocate and free memory blocks (referred to as chunks, from now on) in O(1) constant time. This implementation also uses very little memory: when creating the pool, a very small Pool structure is allocated, along with the pool itself. Free chunks are used to store information, so the memory impact is minimal.
    
  - url: https://blog.cloudflare.com/behind-the-scenes-with-stream-live-cloudflares-live-streaming-service/
    title: "Behind the scenes with Stream Live, Cloudflare’s live streaming service"
    description: |
      Stream Live accepts audio/video content from broadcasters and makes that content available to viewers around the world in real time through the Cloudflare network. This post look into how they build broadcast ingestion with RTMPS, SRT, WHIP and Spectrum. The data is converted and store in their Durable Object, then serve to viewer through HLS or DASH protocol.

  - url: https://benjamincongdon.me/blog/2021/08/17/B-Trees-More-Than-I-Thought-Id-Want-to-Know/
    title: "B-Trees: More Than I Thought I'd Want to Know"
    description: |
      B-Trees were essentially “better” Binary Search Trees, with some hand-waving done that they had improved performance when used in database applications. But it's more than just that, today we will look into disk constraint, slotted pages to see how B-Tree node fit naturally into a page - a chunk of data that the harddrive read all in the same  time.

