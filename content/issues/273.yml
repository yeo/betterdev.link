time: "Jan 12, 2025"
subject: "Operating System in 1,000 Lines"
draft: false

description: |
  Hi all,

  Happy new year. Welcome to the first issue of 2025. I'm trying to become more regular this year. Looking forward to a new year and hope everyone continue to build cool thing. For me, I was unable to launch my another SaaS last year. I did overhault my cloudcost https://ec2.shop and much more happy with its state now.

  This week our sponsor is [WarpStream](https://www.vpdae.com/redirect/k7kvnm9mmen45caob7mevk59rv0), they have build an amazing Kafka alternative while 100% compatible with Kafka and way more cheaper. If you are running Kafka in Kubernetes, or looking to replace Redis with Kafka, [like Honeybadger team did](https://www.honeybadger.io/blog/sidekiq-to-karafka/), then definetely give [WarpStream](https://www.vpdae.com/redirect/k7kvnm9mmen45caob7mevk59rv0) a try.

  If you enjoy BetterDev, please spread the word by sharing it with your friends. And if you'd like to support my work, [buying me a coffee](https://www.buymeacoffee.com/betterdev) would be much appreciated.


