links:
  - url: https://www.vpdae.com/redirect/k7kvnm9mmen45caob7mevk59rv0
    title: "Pixel Federation Swaps Amazon MSK for WarpStream, Saves 83% on Apache Kafka Costs"
    description: |
      The video game company Pixel Federation uses Kafka as the message bus to power its real-time data streaming infrastructure. However, they were leveraging Amazon MSK and their bill was growing faster than their data volumes and they had to use complex networking like VPC peering. [By switching to WarpStream, they saved 83% and ditched VPC peering and manual partition rebalancing](https://www.vpdae.com/redirect/k7kvnm9mmen45caob7mevk59rv0)
    category: ['sponsor']

  - url: https://operating-system-in-1000-lines.vercel.app/en/
    title: "Operating System in 1,000 Lines"
    description: |
      build a small operating system from scratch, step by step.
      You might get intimidated when you hear OS or kernel development, the basic functions of an OS (especially the kernel) are surprisingly simple. Even Linux, which is often cited as a huge open-source software, was only 8,413 lines in version 0.01. Today's Linux kernel is overwhelmingly large, but it started with a tiny codebase, just like your hobby project.
      We'll implement basic context switching, paging, user mode, a command-line shell, a disk device driver, and file read/write operations in C. Sounds like a lot, however, it's only 1,000 lines of code!

