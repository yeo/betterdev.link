time: "Aug 19, 2024"
subject: "blocking=render: Why would you do that?!"
draft: false
description: |
  Hi all,

  Another issue for another week. Trying to get back to my schedule. If you like BetterDev, please help spead word out by refer to your friends. [Buy me a coffee](https://www.buymeacoffee.com/betterdev) would be great too.

  This week we had a big security issue with Github. If you had archive the whole directory, the Github token may leak into the artifact. Read more here: [https://unit42.paloaltonetworks.com/github-repo-artifacts-leak-tokens/](https://unit42.paloaltonetworks.com/github-repo-artifacts-leak-tokens/)

  I also found this amazing tool call that [allow you to auto apply job to linkedin](https://github.com/feder-cr/linkedIn_auto_jobs_applier_with_AI). Try it out to increase your chance. The job market is tough these day.

