    description: |
      for Go readers: terminal GIFs as code - a `.tape` script of Type, Sleep and Wait commands run against a virtual terminal and rendered to GIF, MP4 or WebM, plus a `vhs serve` SSH endpoint so CI can record a demo it never installed. MIT.
