  - url: https://github.com/AkihiroSuda/gomodjail
    title: gomodjail
    description: |
      for Go readers: mark a dependency `// gomodjail:confined` in go.mod and it statically proves that module can never reach the filesystem, network, exec or raw syscalls, walking reachability with Capslock - reflection and assembly still escape it. Apache-2.0.
    category: ['Go']

