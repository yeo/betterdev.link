links:
  - url: https://www.vpdae.com/redirect/7tww2utweep1nyg7vydaoinmugd
    title: "Dragonfly: the multi-threaded, Redis-compatible data store that runs on a fraction of the nodes"
    description: |
      <p style="display: block; margin-block-start: 0.75rem;">Redis was designed in 2009 for single-core machines, and it still runs one core per process. On a modern 64-core server that means most of the machine sits idle, and the only way to use it is to shard across more nodes. You end up paying for compute your data store cannot reach.<br></p>
      <p style="display: block; margin-block-start: 0.75rem;"><a href="https://www.vpdae.com/redirect/7tww2utweep1nyg7vydaoinmugd">Dragonfly</a> takes the other path. It is not a fork of Redis or Valkey. Its technical founder spent years as a principal engineer on AWS ElastiCache and saw where managed Redis hits a wall at scale, so he built a replacement from the ground up. It uses a thread-per-core, shared-nothing architecture and a new hash table design that cuts memory overhead by around 40% compared to Redis's dict. The result is roughly 6M ops/sec on a single node, so workloads that currently need a cluster fit comfortably on one machine. Instacart migrated to Dragonfly, cut average latency in half, and now runs 70% fewer nodes.<br></p>
      <p style="display: block; margin-block-start: 0.75rem;"><a href="https://www.vpdae.com/redirect/7tww2utweep1nyg7vydaoinmugd">Dragonfly</a> speaks the Redis and Valkey wire protocol, so your existing clients and commands work unchanged. Open source, single binary, easy to benchmark against your own workload, and available as a fully managed cloud service if you would rather not run it yourself.<br></p>
    category: ['sponsor']


  - url: https://austinhenley.com/blog/python1024.html
    title: Making a Python interpreter in 1024 bytes
    description: |
      1024 bytes of C, and it still runs if/else, while, for over range(), and function definitions. No AST, no bytecode: a recursive descent parser executes as it reads, and a loop just seeks backwards and reparses the source each iteration, letting the C stack do the recursion. Variables are single letters, so the ASCII value is the symbol table index.


  - url: https://hawksley.dev/blog/get-free-arpa-domain
    title: How to get a free .arpa domain
    description: |
      .arpa is the infrastructure TLD nobody sells you. A free Hurricane Electric IPv6 tunnel hands you a routed prefix, and that prefix is also a name: nibble-reverse it and the matching ip6.arpa zone is yours, rDNS delegation included. Delegate it to deSEC, CNAME to a host, and you have a site. The catch: most CAs won't issue for .arpa, so no HTTPS.


  - url: https://boyter.org/posts/did-i-just-get-buster-scrugged/
    title: Did I just get Buster Scrugged?
    description: |
      A rival counter, mezura, benchmarked 2.56x faster than scc, so Ben went strace hunting instead of arguing. The culprits were all his own: a thread pool spinning on futexes, and Go's `os.Open` firing 95,897 doomed epoll registrations on plain files. 2.37x later scc chews 1.5 GB of source in 167ms, and is 1.22x ahead.


  - url: https://toonk.io/packetio/
    title: Four ways to do super fast packet processing in Go
    description: |
      AF_PACKET, AF_XDP, DPDK and mlx5 Direct Verbs behind one Go API, so changing backend is mostly a different open call. The one worth the read is Direct Verbs: hardware steering lets your app claim specific flows while Linux keeps the interface as usual, and it still hits 148.6 Mpps on 64-byte packets.


  - url: https://tautology.town/2026/06/01/card-networks.html
    title: "What do Visa and Mastercard do? An intro to card networks"
    description: |
      Visa is not a bank, and it is not the one taking most of your merchant fee. On a $100 sale the issuer keeps $2.00 for carrying credit and fraud risk, the processor $0.35, and Visa itself $0.15 for routing and netting. What it really sells is settlement: $84.3B moved on an average day in 2024, backed by an $11.2B liquidity reserve.


  - url: https://hdombrovskaya.wordpress.com/2026/08/25/how-to-optimize-when-you-cant-do-anything/
    title: "How to optimize when you can't do anything!"
    description: |
      16 billion rows, 750 GB, and a date-overlap predicate no index is helping with - the GIST index that would fix it needs over a day to build, so it is off the table. What ships instead is a 2,000-row mapping table holding the earliest start_date per filter combination: join that first, and minutes become under 100ms.


  - url: https://thebuild.com/blog/sixteen-locks-ought-to-be-enough-for-anybody/
    title: Sixteen Locks Ought to Be Enough for Anybody
    description: |
      Each backend caches 16 relation locks in private memory; lock 17 falls through to the shared lock table behind 16 LWLocks, and the table carrying 20 indexes is exactly the one every query touches. Planning takes a lock on every index it considers, not the one it picks - 22 locks for a single query. Postgres 18 raises the fast path to 64.


  - url: https://vincent.bernat.ch/en/blog/2026-spanning-tree
    title: An Interactive Tour of the Spanning Tree Protocol
    description: |
      Cut a link in the diagram and watch the root election and the blocked ports rearrange themselves. The mechanism is a proposal-agreement handshake that syncs neighbours before a port starts forwarding, so a repair settles in under a second. The failure mode is count-to-infinity: lose the root in the wrong topology and bridges oscillate until BPDUs age out, 20+ seconds later.


  - url: https://www.rubyhack.ai/
    title: "OpenAI agents carried out an undisclosed cyber-attack on RubyGems"
    description: |
      A report claiming AI agents ran an undisclosed attack on RubyGems: 2,000+ malicious packages between May and June, exploiting RubyDoc.info's automatic documentation builds for remote code execution, apparently to scrape UK local government data. The packages carried "oai" in their names and the agents identified themselves. RubyGems froze new registrations for four days; whether any API keys were stolen is still unclear.


