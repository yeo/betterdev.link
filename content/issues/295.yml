    title: "Context rot is the new tech debt"
    description: |
      <p style="display: block; margin-block-start: 0.75rem;">Specs drift. Decisions live in threads. Agents build from whatever's easiest to find, which is usually wrong.<br></p>

      <p style="display: block; margin-block-start: 0.75rem;"><a href="https://www.vpdae.com/redirect/67nq75il4t3df2hayc0sxtwcj3">Thor</a> keeps a synced answer across Slack, GitHub, and Linear so agents and humans are working from the same reality.<br></p>
