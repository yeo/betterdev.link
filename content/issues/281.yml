    title: "How to create an OS from scratch"
    description: |
      May sound overwhelm but it's very approachable with step by step building from previous foundation. Eg to write the initial boot loader you just need:
        loop:
            jmp loop
        
        times 510-($-$$) db 0
        dw 0xaa55

      A very detail setup so you can prepare emulator to start learning these.

