time: "Sep 30, 2024"
subject: "Compiling to Assembly from Scratch and A Reintroduction to Programming"
draft: false

description: |
  Hi all,

  Welcome to another issue of BetterDev. This week PostgreSQL 17 is released. It has a lot of amazing feature. Time to update and look over the [release note](https://www.postgresql.org/docs/17/release-17.html). If you are a Postgres user, consider subscribe to [Postgres Weekly as well](https://postgresweekly.com)

  If you enjoy BetterDev, please spread the word by sharing it with your friends. And if you'd like to support my work, [buying me a coffee](https://www.buymeacoffee.com/betterdev) would be much appreciated.

