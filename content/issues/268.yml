  - url: https://keleshev.com/compiling-to-assembly-from-scratch/#table-of-contents
    title: "Compiling to Assembly from Scratch"
    description: |
      Have you been trying to learn how compilers and programming languages work?
      Then come along! Let’s make a compiler that goes all the way from source to assembly from scratch—no shortcuts
      This book will teach you enough compiler theory and assembly programming to get going. It uses a subset of TypeScript that reads like pseudocode and targets ARM 32-bit instruction set.

  - url: https://www.0de5.net/explore
    title: "A Reintroduction to Programming"
    description: |
      Imagion composing a BMP image by hand, or writing a executable file manually? What kind of knowledge need to do that? Mastery of computer programming unlocks power, flexibility, speed, and debugging prowess across all of your work. We will learn in depth what you use every day, by exploring memory, instructions, syscalls, functions, structure and cognition.

  - url: https://tembo.io/blog/image-search
    title: "Building an image search engine on Postgres"
    description: |
      Have you ever want a search to find similar image? In this blog we’ll build a basic image search engine using Postgres. We’ll use a pre-trained model to generate embeddings for images and text, then store those embeddings in Postgres. The pgvector extension will enable us to conduct similarity searches on these embeddings using both images and raw-text as queries.

  - url: https://christophergs.com/blog/production-rag-with-postgres-vector-store-open-source-models
    title: "Production RAG with a Postgres Vector Store and Open-Source Models"
    description: |
      Part 6 of an AI Engineering open-source models tutorial series. We focus on RAG on this article. A RAG pipeline is what allows your AI model(s) to leverage the knowledge of your private/corporate data in its inference. It consists of the following stages: loading, indexing, storing, querying and evaluation.

  - url: https://kettanaito.com/blog/dont-sleep-on-abort-controller
    title: "Don't Sleep on AbortController"
    description: |
      In JavaScript, more often that not you may want to cancel a request? Imagine an auto-completed, when user type more, you may want to cancel the previous request, there is no point to get them.
      AbortController is a global class in JavaScript that you can use to abort these fetch request. And also anything else, not just http request.

  - url: https://fljd.in/en/2024/09/19/hierarchical-data-types/
    title: "Hierarchical data types"
    description: |
      Parent-child relationship happens a lot in context of web dev. Even harder when it's nested. Example, nested comment. In this shortarticle we look at the `ltree` Postgres extension to store and retreive that data type.

