- url: https://goodyduru.github.io/os/2023/09/08/ipc-introduction.html
  title: How two processes can communicate in one device using IPC
  description: |
    Simple way we can use shared file, you can use a client <-> server, but that involve you are need to setup port, sending and serializing data.
    What if you want your processes to be independent, to communicate, and yet not distribute some arcane shell scripts along with them? It turns out that other IPC mechanisms allow you to do all these.  This a series so make you check all the part.

