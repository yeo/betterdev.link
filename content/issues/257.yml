  title: "Slack Journey Migrating to AWS IMDSv2"
  description: |
    Have you ever query 169.254.169.254 you deal with AWS IDMS service. Anyone can query that from an EC2 instance. In 2019, they release IMDSv2, which require a token so it's more secure.
    Slack running 60,000 AWS instance. How can they roll this out safely across the fleet of services on all these 60,000 server to use IDMSv2

