- url: https://www.netmeister.org/blog/dns-tcpdump.html
  title: "DNS tcpdump by example"
  description: |
    analyze traffic of DNS is a easier and fun practice because it has no encryption, unlike HTTPS or SSH. So you can actually look at the payload.
    In this article we will walk through th exercise to analyze this traffic of querying a DNS end to end, what happen, where do they get their data.
    Knowing this knowledge will put you on the top 10% of software programmer.

