time: "Apr 22, 2024"
subject: "Building a GPS Receiver"
draft: false
description: |
  Hi all,

  We come back with a new issue this week. If you like BetterDev, please help spead word out by refer to your friends. [Buy me a coffee](https://www.buymeacoffee.com/betterdev) would be great too.

  This week I come across [awesome-secure-defaults](https://github.com/tldrsec/awesome-secure-defaults), a collection of libs to help us secure our app by setting right HTTP header, crypto libs, CSRF,...Browswing these kind of libs usually will help identify gap in your knowledge, because there is term or concept you might not know. So def give us a read. Now onward to our issue.

