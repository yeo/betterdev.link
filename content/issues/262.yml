  - url: https://www.cybertec-postgresql.com/en/why-do-i-have-a-slow-commit-in-postgresql/
    title: "why do i have a slow commit in PostgreSQL?"
    description: |
      Normally, COMMIT is a very fast statement in PostgreSQL, so that is worth investigating. In this article, I will explore the possible reasons for a slow COMMIT and discuss what you can do about it.


  - url: https://scottarc.blog/2024/06/04/attacking-nist-sp-800-108/
    title: "Attacking NIST SP 800-108"
    description: |
      NIST 800 are guidelines, recommendations, technical specifications, and annual reports of NIST's cybersecurity activities. 800-108 focus on recommendation for Key Derivation Using Pseudorandom Functions. In this post, we will look into a novel security issue with this standard


  - url: https://scottarc.blog/2024/06/02/encryption-at-rest-whose-threat-model-is-it-anyway/
    title: "Encryption At Rest: Whose Threat Model Is It Anyway?"
    description: |
      To quote to OP, "Unsurprisingly, I’ve heard a few infosec thought leader types insist that encryption-at-rest is security theater over the years. I disagree with this assessment in the absolute terms, but there is a nugget of truth in that assertion.". To which I agree.

  - url: https://notso.boringsql.com/posts/custom-postgresql-extensions-with-rust/
    title: "Custom PostgreSQL extensions with Rust"
    description: |
      I used to be able to pick-up Rust in a single week and become productive very fast. Rust has open us the ability to write low level component in such a high level language.
      This article exporers [pgrx](https://github.com/pgcentralfoundation/pgrx), which simplifies the creation of custom PostgreSQL extensions to bring more logic closer to your database.

