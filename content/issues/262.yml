  - url: https://samcurry.net/hacking-millions-of-modems
    title: "Hacking Millions of Modems (and Investigating Who Hacked My Modem)"
    description: |
      What would you do if one day you're realized your modem was being hack and MiTM your request?
      In this amazing and crazy stories, a Cox modem was hacked. The bug was also really interesting, if repeated a same request multiple time, we will eventually can by pass the authentication.

  - url: https://tenderlovemaking.com/2016/02/05/i-am-a-puts-debuggerer/
    title: "I am a puts debuggerer"
    description: |
      printf vs debugger is a holy war in programming, and has cause endless internet fight or fame.
      Today, we won't go into that. We will simply go through a list of common scenartio and see how we can use printf to debug the situation.
      This is a Ruby article, but if you like the approach, they can easily ported to your own language. Methodlogy is what we will focus here.

