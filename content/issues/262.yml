  - url: https://coder.com/blog/delivering-5x-faster-throughput-in-coder-2-12-0
    title: "How We Improved the Performance of a Userspace TCP Stack in Go by 5X"
    description: |
      Throughput - the rate at which you can send or receive data across a network
      Throughput is usually quoted in bits per second, and on modern internet networks, these range from a few millions of bits per second (Mb/s) to a few billions of bits per second (Gb/s).
      If you had work with a remote connection such as SSH through a VPN tunnel you will notice the differencies of responsiveness when workign with  a code editor.
      Coder is self-hosted cloud development environments, and they build their own TCP stacks, and share with us experience and their deep dive to increase perf 5x.

