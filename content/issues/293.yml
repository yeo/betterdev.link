subject: "The startup's Postgres survival guide""
draft: true

description: |
  Hi everyone,

  In 2013, I was a PHP Dev, MySQL with its replication features and percona backup and mysql proxy is my bread and butter. In 2017, I starts to use Postres and in last 9 years I used ti for everything. I operated db up to 20TB on a 64GB RAM machine with thousand read/write, employee many optimization and Postgres never failed me. Strongly recommend.

  If you enjoy BetterDev, please spread the word by sharing it with your friends. And if you'd like to support my work, [buying me a coffee](https://www.buymeacoffee.com/betterdev) would be much appreciated.

