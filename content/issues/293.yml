  - url: https://www.vpdae.com/redirect/n693tnmyws1shxluv15d2u9e3bu
    title: "Your AI agent needs API access. It shouldn’t need the API key."
    description: |
      <p style="display: block; margin-block-start: 0.75rem;">AI agents need access to GitHub, Stripe, Linear, and other services to do useful work. But handing an agent a real API key creates credential exfiltration risk through prompt injection, a compromised runtime, or exposure to the LLM provider.<br></p>
      <p style="display: block; margin-block-start: 0.75rem;">Infisical Agent Proxy lets agents use those services without ever seeing the underlying secret. The agent receives a placeholder, and the proxy swaps in the real credential only when the outbound request crosses the network boundary.<br></p>
      <p style="display: block; margin-block-start: 0.75rem;">The result: developers can keep building and deploying agents without putting real credentials inside unpredictable workloads. Existing API calls, SDKs, CLIs, and MCP connections continue to work, and 30+ pre-built integrations reduce the configuration required.<br></p>
      <p style="display: block; margin-block-start: 0.75rem;">See how Infisical Agent Proxy helps teams give AI agents access to the services they need without handing over the secrets behind them. Explore how it works, review the supported integrations, and start building for free with less credential risk.<br></p>
