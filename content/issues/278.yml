time: "Mar 31, 2025"
subject: "30 years of PostgreSQL buffer manager locking design evolution"
draft: false

description: |
  Hi all,

	So this week, [Github CodeQL leaked their token](https://www.praetorian.com/blog/codeqleaked-public-secrets-exposure-leads-to-supply-chain-attack-on-github-codeql/); the token was only publicly exposed for about 2 seconds, but that's enough. Then, we had [Malware found on npm infecting local packages with a reverse shell](https://www.reversinglabs.com/blog/malicious-npm-patch-delivers-reverse-shell). And an [atop heap issue](https://openwall.com/lists/oss-security/2025/03/29/1). The world truly fell apart last week, no joke. That's why it's helpful to be paranoid whenever we run any piece of software on our CI, on our dependencies—always vet them yourself.


  If you enjoy BetterDev, please spread the word by sharing it with your friends. And if you'd like to support my work, [buying me a coffee](https://www.buymeacoffee.com/betterdev) would be much appreciated.

