time: "Mar 31, 2025"
subject: "30 years of PostgreSQL buffer manager locking design evolution"
draft: false

description: |
  Hi all,

  So this week, [Github CodeQL leak their token](https://www.praetorian.com/blog/codeqleaked-public-secrets-exposure-leads-to-supply-chain-attack-on-github-codeql/), the token is only publicly expose for about 2seconds, but that's enough. Then, we had [Malware found on npm infecting local package with reverse shell](https://www.reversinglabs.com/blog/malicious-npm-patch-delivers-reverse-shell). And an [atop heap issue](https://openwall.com/lists/oss-security/2025/03/29/1). The world truly fall apart last week, no joke. That's why it's help to be paranoid whenever we run any piece of software on our CI, on our dependenies, always vetted it yourself.

  If you enjoy BetterDev, please spread the word by sharing it with your friends. And if you'd like to support my work, [buying me a coffee](https://www.buymeacoffee.com/betterdev) would be much appreciated.

