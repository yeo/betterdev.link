subject: "Tracking You from a Thousand Miles Away! Turning a Bluetooth Device into an Apple AirTag Without Root Privileges"
draft: true

description: |
  Hi all,

  In the wave of [ByBit exchange being hack for 1.6billion](https://x.com/safe/status/1897663514975649938), and the hack is very sophisciated, exploit developer access key to change an s3 bucket. The attack start by having the developer run some untrusted docker compose with `privileged: true` I'll include a few more tools in security, vulnerable scan, and supply chain attack.

  If you enjoy BetterDev, please spread the word by sharing it with your friends. And if you'd like to support my work, [buying me a coffee](https://www.buymeacoffee.com/betterdev) would be much appreciated.

